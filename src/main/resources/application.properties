spring.application.name=student-api

# ===============================
# MYSQL
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/student_api?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=pasword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# SERVER
# ===============================

server.port=8080

# ===============================
# 2GIS
# ===============================
# API key is read from the environment or local .env file.
# Never commit a real API key to GitHub.
spring.config.import=optional:file:.env[.properties]
2gis.api-key=${2GIS_API_KEY:}
